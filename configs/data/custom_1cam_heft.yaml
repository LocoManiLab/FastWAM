train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - /path/to/lerobot_dataset  # always overridden by LocoManiLab convert/train --dataset
  shape_meta:
    images:
      - key: ego_view
        # key "ego_view" → lerobot key "observation.images.ego_view"
        raw_shape: [3, 480, 640]
        shape: [3, 224, 224]
    action:
      - key: ref_qpos
        # key "ref_qpos" → lerobot key "action.ref_qpos"
        # heft (motion_tracking sim2real) reference frame: root_pos(3) + root_quat wxyz(4)
        # + 29 joint targets (left_leg 6, right_leg 6, waist 3, left_arm 7, right_arm 7).
        # All absolute (not deltas) — this is the tracking policy's own reference input.
        lerobot_key: action.ref_qpos
        raw_shape: 36
        shape: 36
      - key: hands
        # key "hands" → lerobot key "action.hands"
        # 2-dim hand open/close scalar (heft's teleop squeeze signal, not Dex3 finger joints).
        lerobot_key: action.hands
        raw_shape: 2
        shape: 2
    state:
      - key: default
        # key "default" → lerobot key "observation.state"
        # 29-dim joint positions: left_leg(6) + right_leg(6) + waist(3) + left_arm(7) + right_arm(7).
        # Unlike sonic, heft does NOT fold hand state into observation.state (it's a separate
        # 14-dim observation.hand_state Dex3 channel) — not used as proprio here, matching how
        # gr00t's unitree_g1_heft training also skips it as an action target for now.
        raw_shape: 29
        shape: 29
  # Dataset is 50 fps; stride=5 makes effective rate 10 fps.
  # With 33 frames × stride 5: covers 165 original frames = 3.3 s of real data.
  num_frames: 33
  global_sample_stride: 5
  # action_video_freq_ratio=4: 32 action steps → 8 video frames + 1 reference = 9 video frames
  action_video_freq_ratio: 4
  # Single camera; [H, W] = [224, 224] (square crop from 480×640 center)
  video_size: [224, 224]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: null   # single camera, no concatenation
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 38   # ref_qpos(36) + hands(2)
    proprio_output_dim: 29  # observation.state dim (heft, body joints only)
    # ref_qpos + hands are all absolute (tracking-policy reference targets), no delta encoding.
    delta_action_dim_mask: null
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: /path/to/lerobot_dataset/cache_t5  # overridden by LocoManiLab
  context_len: 128
