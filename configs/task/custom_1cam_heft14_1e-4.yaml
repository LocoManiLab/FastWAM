# @package _global_
# bench heft variant (Dex3 14-D hands, 240x320 video): same hyperparams as
# custom_1cam_heft_1e-4 but on the custom_1cam_heft14 data config (action 50 = ref_qpos 36 + hands 14).

defaults:
  - override /data: custom_1cam_heft14
  - override /model: fastwam
  - _self_

# dataloading
batch_size: 8
num_workers: 4

model:
  mot_checkpoint_mixed_attn: true   # gradient checkpointing, saves VRAM

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 50
max_steps: null
log_every: 10
save_every: 10000
eval_every: 500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
